name: Desktop Schema Sync

# Watches the upstream desktop app (farion1231/cc-switch) for database schema
# bumps, ports the *additive* migrations into this CLI fork, and — when the
# port, the tests and the Windows build all succeed — publishes a fork-patch
# release tagged `<closest-cli-version>+cc.<n>`.
#
# Why a separate workflow from upstream-sync.yml:
#   * upstream-sync.yml follows CLI releases (SaladDay/cc-switch-cli) and keeps
#     the Cargo version equal to the upstream tag.
#   * this workflow only reacts to desktop schema changes, which do not bump
#     the CLI version. Its releases therefore use semver build metadata
#     (5.11.4+cc.1), which sorts above 5.11.4 and below the next patch release.
#
# Fail-closed: scripts/port_desktop_schema.py exits non-zero for any migration
# that is not pure add_column_if_missing / table_exists / set_user_version, and
# the job stops before committing.

on:
  schedule:
    # Every 6 hours, offset from the CLI sync job.
    - cron: '43 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish a fork patch release even if no schema change is detected'
        type: boolean
        default: false

permissions:
  contents: write

env:
  RUST_VERSION: 1.91.1
  DESKTOP_REPO: farion1231/cc-switch

concurrency:
  group: main-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Port desktop schema
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve desktop release
        id: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! RELEASE=$(gh api "repos/${DESKTOP_REPO}/releases/latest" 2>/dev/null); then
            echo "Desktop repository has no published release; nothing to do."
            exit 0
          fi

          TAG=$(jq -r '.tag_name // empty' <<<"${RELEASE}")
          DRAFT=$(jq -r '.draft // false' <<<"${RELEASE}")
          PRERELEASE=$(jq -r '.prerelease // false' <<<"${RELEASE}")
          if [ -z "${TAG}" ] || [ "${DRAFT}" = "true" ] || [ "${PRERELEASE}" = "true" ]; then
            echo "Latest desktop release is not a stable published release; nothing to do."
            exit 0
          fi

          echo "Latest desktop release: ${TAG}"
          mkdir -p "${RUNNER_TEMP}/desktop"
          gh api "repos/${DESKTOP_REPO}/contents/src-tauri/src/database/mod.rs?ref=${TAG}" \
            --jq '.content' | base64 -d > "${RUNNER_TEMP}/desktop/mod.rs"
          gh api "repos/${DESKTOP_REPO}/contents/src-tauri/src/database/schema.rs?ref=${TAG}" \
            --jq '.content' | base64 -d > "${RUNNER_TEMP}/desktop/schema.rs"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "schema_dir=${RUNNER_TEMP}/desktop" >> "${GITHUB_OUTPUT}"

      - name: Port schema
        id: port
        if: steps.desktop.outputs.tag != ''
        run: |
          set -euo pipefail

          OURS=$(sed -n 's/.*SCHEMA_VERSION: i32 = \([0-9][0-9]*\);/\1/p' src-tauri/src/database/mod.rs | head -n 1)
          DESKTOP=$(sed -n 's/.*SCHEMA_VERSION: i32 = \([0-9][0-9]*\);/\1/p' "${{ steps.desktop.outputs.schema_dir }}/mod.rs" | head -n 1)
          echo "CLI schema v${OURS}, desktop schema v${DESKTOP}"

          if [ "${DESKTOP}" -le "${OURS}" ]; then
            echo "Desktop schema is not ahead of the CLI; nothing to port."
            exit 0
          fi

          python3 scripts/port_desktop_schema.py \
            --desktop-mod "${{ steps.desktop.outputs.schema_dir }}/mod.rs" \
            --desktop-schema "${{ steps.desktop.outputs.schema_dir }}/schema.rs" \
            --cli-root .

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "schema=${DESKTOP}" >> "${GITHUB_OUTPUT}"

      - name: Setup Rust
        if: steps.port.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        if: steps.port.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: desktop-schema-sync

      - name: Test database layer
        if: steps.port.outputs.changed == 'true'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --lib database::

      - name: Compute fork patch version
        id: version
        if: steps.port.outputs.changed == 'true'
        run: |
          set -euo pipefail

          BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          BASE=${BASE%%+*}

          git fetch --tags --force origin
          MAX=$(git tag -l "v${BASE}+cc.*" | sed -E 's/.*\+cc\.([0-9]+)$/\1/' | sort -n | tail -n 1)
          NEXT=$(( ${MAX:-0} + 1 ))
          VERSION="${BASE}+cc.${NEXT}"

          python3 - "${VERSION}" <<'PY'
          import re, sys, pathlib
          new = sys.argv[1]
          path = pathlib.Path("src-tauri/Cargo.toml")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(r'^version = "[^"]+"', f'version = "{new}"', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("could not rewrite Cargo.toml version")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          echo "Computed fork patch version ${VERSION}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push
        id: publish
        if: steps.port.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > "${RUNNER_TEMP}/commit-msg" <<EOF
          [desktop-sync] ${{ env.DESKTOP_REPO }} ${{ steps.desktop.outputs.tag }} schema-${{ steps.port.outputs.schema }}

          Ports the desktop app's additive schema migrations into this CLI fork
          and publishes a fork patch release on top of the current CLI version.

          Co-Authored-By: Claude Code <noreply@anthropic.com>
          EOF

          git add src-tauri/Cargo.toml src-tauri/src/database/mod.rs src-tauri/src/database/schema.rs
          git commit --no-verify -F "${RUNNER_TEMP}/commit-msg"

          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build-windows:
    name: Build Windows package
    needs: sync
    if: needs.sync.outputs.tag != ''
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: desktop-schema-windows

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ needs.sync.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/cc-switch.exe dist/cc-switch.exe
          Compress-Archive -Path dist/cc-switch.exe -DestinationPath "dist/cc-switch-cli-$env:TAG-windows-x64.zip" -Force
          Copy-Item "dist/cc-switch-cli-$env:TAG-windows-x64.zip" dist/cc-switch-cli-windows-x64.zip

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum cc-switch-cli-*.zip > checksums.txt
          cat checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-cli-windows-x64-fork
          path: |
            dist/cc-switch-cli-*.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    name: Publish fork patch release
    needs: [sync, build-windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: cc-switch-cli-windows-x64-fork
          path: dist

      - name: Create version branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${{ needs.sync.outputs.sha }}:refs/heads/release/${{ needs.sync.outputs.tag }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sync.outputs.tag }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it untouched."
            exit 0
          fi
          gh release create "${TAG}" \
            --title "CC Switch CLI ${TAG}" \
            --target "${SHA}" \
            --latest \
            --notes "Fork patch build: ports the upstream desktop app's database schema migrations into this CLI fork. Windows x86_64 only." \
            dist/cc-switch-cli-*.zip \
            dist/checksums.txt
